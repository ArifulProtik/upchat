# golangci-lint v2 configuration
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
    - gofumpt # stricter gofmt (superset)
    - goimports # manages import grouping + formatting
    - golines # wraps long lines

  settings:
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"

    gofumpt:
      module-path: "" # set to your module path e.g. github.com/org/repo
      extra-rules: true

    goimports:
      local-prefixes:
        - ArifulProtik/UpChat # replace with your module path

    golines:
      max-len: 120
      tab-len: 4

linters:
  default: none
  exclusions:
    paths:
      - "ui/.*"
  enable:
    # --- Bugs & Correctness ---
    - errcheck # checks that errors are handled
    - govet # reports suspicious constructs (shadow, printf, etc.)
    - ineffassign # detects useless assignments
    - staticcheck # advanced static analysis (replaces megacheck)
    - unused # finds unused code

    # --- Style & Maintainability ---
    - godot # checks comment endings
    - misspell # spell checker for comments and strings
    - unconvert # removes unnecessary type conversions
    - unparam # finds unused function parameters
    - whitespace # detects trailing whitespace and blank line issues

    # --- Complexity ---
    - cyclop # cyclomatic complexity
    - funlen # limits function length
    - gocognit # cognitive complexity

    # --- Security ---
    - gosec # security checks (G001–G999)

    # --- Performance ---
    - prealloc # suggests pre-allocation for slices

    # --- Best Practices ---
    - contextcheck # checks that context.Context is passed correctly
    - durationcheck # detects multiplication of time.Duration
    - errorlint # checks for error wrapping issues
    - exhaustive # checks exhaustiveness of enum switches
    - makezero # finds slice declarations that could cause bugs
    - noctx # finds http requests sent without context
    - nolintlint # checks nolint directives are valid
    - rowserrcheck # checks sql.Rows.Err is always checked
    - sqlclosecheck # checks sql.Rows and sql.Stmt are closed

  settings:
    cyclop:
      max-complexity: 15

    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 20

    gosec:
      excludes:
        - G115 # integer overflow conversion (noisy in most codebases)

    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable:
        - shadow

    exhaustive:
      default-signifies-exhaustive: true
    # exclusions:
    #   paths:
    #     - "ui/.*"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

  fix: true # auto-fix issues where possible
