name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type check UI
        working-directory: ui
        run: bun run check

      - name: Lint UI
        working-directory: ui
        run: bun run lint
